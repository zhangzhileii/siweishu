<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>密码输入</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background: #f5f5f5;
}

/* =========================
   全屏遮罩
========================= */

.password-mask {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 99999;

    background: rgba(0, 0, 0, .55);

    display: flex;

    align-items: flex-end;

    opacity: 1;
    visibility: visible;
}


/* =========================
   全屏密码区域
========================= */

.password-dialog {

    width: 100%;
    height: 100%;

    background: #fff;

    display: flex;
    flex-direction: column;

    padding-top: 18px;

    padding-bottom:
        calc(12px + env(safe-area-inset-bottom));
}


/* =========================
   顶部空白区域
========================= */

.dialog-header {

    height: 38px;

    flex-shrink: 0;
}


/* =========================
   密码标题
========================= */

.title {

    margin:
        auto
        20px
        28px;

    font-size: 21px;

    font-weight: 700;

    color: #222;

    text-align: center;

    flex-shrink: 0;
}


/* =========================
   四个密码圆点
========================= */

.dots {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 43px;

    margin-bottom: 35px;

    flex-shrink: 0;
}


.dot {

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #cfcfcf;

    transition:
        transform .08s ease,
        background .08s ease;
}


.dot.active {

    background: #777;

    transform: scale(1.08);
}


/* =========================
   数字键盘
========================= */

.keypad {

    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 2px;

    background: #e5e7eb;

    border-top:
        1px solid #e5e7eb;

    margin-top: auto;

    flex-shrink: 0;
}


/* =========================
   数字按钮
========================= */

.key {

    height: 58px;

    border: 0;

    border-radius: 0;

    background: #fff;

    color: #222;

    font-size: 21px;

    font-weight: 400;

    touch-action: manipulation;

    user-select: none;
}


.key:active {

    background: #e5e5e5;
}


/* =========================
   数字下面的 ABC
========================= */

.key .letters {

    display: block;

    margin-top: 1px;

    font-size: 8px;

    line-height: 9px;

    font-weight: 600;

    color: #555;
}


/* =========================
   空白按钮
========================= */

.key.empty {

    background: #f1f3f6;

    pointer-events: none;
}


/* =========================
   删除按钮
========================= */

.key.delete {

    font-size: 20px;

    background: #fff;
}


/* =========================
   屏幕较矮的安卓手机
========================= */

@media (max-height: 650px) {

    .title {

        margin-bottom: 20px;

        font-size: 20px;
    }

    .dots {

        margin-bottom: 20px;
    }

    .key {

        height: 52px;
    }
}


/* =========================
   禁止选择
========================= */

body {
    -webkit-user-select: none;
    user-select: none;
}

</style>

</head>


<body>


<!--
    页面加载后直接显示
    没有关闭按钮
    必须输入4位数字
-->

<div
    class="password-mask"
    id="passwordMask"
>


    <div
        class="password-dialog"
        id="passwordDialog"
    >


        <!-- 顶部空白 -->

        <div
            class="dialog-header"
        ></div>


        <!-- 密码标题 -->

        <div
            class="title"
        >
            Digite sua senha de 4 dígitos
        </div>


        <!-- 四个密码圆点 -->

        <div
            class="dots"
            id="dots"
        >

            <span class="dot"></span>

            <span class="dot"></span>

            <span class="dot"></span>

            <span class="dot"></span>

        </div>


        <!-- 数字键盘 -->

        <div class="keypad">


            <button
                class="key"
                data-number="1"
            >
                1
            </button>


            <button
                class="key"
                data-number="2"
            >
                2

                <span class="letters">
                    ABC
                </span>

            </button>


            <button
                class="key"
                data-number="3"
            >
                3

                <span class="letters">
                    DEF
                </span>

            </button>


            <button
                class="key"
                data-number="4"
            >
                4

                <span class="letters">
                    GHI
                </span>

            </button>


            <button
                class="key"
                data-number="5"
            >
                5

                <span class="letters">
                    JKL
                </span>

            </button>


            <button
                class="key"
                data-number="6"
            >
                6

                <span class="letters">
                    MNO
                </span>

            </button>


            <button
                class="key"
                data-number="7"
            >
                7

                <span class="letters">
                    PQRS
                </span>

            </button>


            <button
                class="key"
                data-number="8"
            >
                8

                <span class="letters">
                    TUV
                </span>

            </button>


            <button
                class="key"
                data-number="9"
            >
                9

                <span class="letters">
                    WXYZ
                </span>

            </button>


            <!-- 左下角空白 -->

            <button
                class="key empty"
                aria-hidden="true"
                tabindex="-1"
            >
            </button>


            <button
                class="key"
                data-number="0"
            >
                0
            </button>


            <!-- 删除 -->

            <button
                class="key delete"
                id="deleteBtn"
                aria-label="删除"
            >
                ⌫
            </button>


        </div>


    </div>

</div>


<script>

/* =========================
   当前输入的密码
========================= */

let password = "";


/* =========================
   DOM
========================= */

const mask =
    document.getElementById(
        "passwordMask"
    );

const dots =
    document.querySelectorAll(
        ".dot"
    );


/* =========================
   更新密码圆点
========================= */

function updateDots() {

    dots.forEach(
        (dot, index) => {

            dot.classList.toggle(
                "active",
                index < password.length
            );

        }
    );

}


/* =========================
   输入数字
========================= */

function inputNumber(number) {

    /* 最多4位 */

    if (password.length >= 4) {
        return;
    }


    password += number;


    updateDots();


    /* =====================
       输入完成4位
    ===================== */

    if (password.length === 4) {

        const result =
            password;


        setTimeout(
            () => {

                /*
                 * 这里可以处理密码
                 *
                 * 例如：
                 *
                 * if (result === "1234") {
                 *     unlockPage();
                 * }
                 */


                console.log(
                    "输入的4位密码:",
                    result
                );


                /*
                 * 输入4位后关闭
                 */

                mask.style.display =
                    "none";

                document.body.style.overflow =
                    "";


            },
            120
        );

    }

}


/* =========================
   数字按钮
========================= */

document
    .querySelectorAll(
        ".key[data-number]"
    )
    .forEach(
        btn => {

            btn.addEventListener(
                "click",
                function () {

                    inputNumber(
                        this.dataset.number
                    );

                }
            );

        }
    );


/* =========================
   删除按钮
========================= */

document
    .getElementById(
        "deleteBtn"
    )
    .addEventListener(
        "click",
        function () {

            if (
                password.length > 0
            ) {

                password =
                    password.slice(
                        0,
                        -1
                    );

                updateDots();

            }

        }
    );


/* =========================
   禁止点击关闭
========================= */

mask.addEventListener(
    "click",
    function (e) {

        e.stopPropagation();

    }
);


/* =========================
   页面打开时锁定滚动
========================= */

document.body.style.overflow =
    "hidden";

</script>


</body>
</html>
