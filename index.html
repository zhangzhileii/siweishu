<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Inserir senha</title>


<style>

/* =========================================================
   基础
========================================================= */

* {
    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

    -webkit-user-select: none;
    user-select: none;
}


html,
body {

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background: #ffffff;
}


/* =========================================================
   全屏遮罩
========================================================= */

.password-mask {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 99999;

    background: rgba(0, 0, 0, 0.55);

    display: flex;

    align-items: flex-end;

    opacity: 1;

    visibility: visible;
}


/* =========================================================
   全屏密码页面
========================================================= */

.password-dialog {

    position: relative;

    width: 100%;
    height: 100%;

    background: #ffffff;

    display: flex;

    flex-direction: column;

    padding-top: 18px;

    padding-bottom:
        calc(12px + env(safe-area-inset-bottom));

    overflow: hidden;
}


/* =========================================================
   顶部空白
========================================================= */

.dialog-header {

    height: 38px;

    flex-shrink: 0;
}


/* =========================================================
   密码标题
========================================================= */

.title {

    margin:
        auto
        20px
        28px;

    width: calc(100% - 40px);

    font-size: 21px;

    line-height: 28px;

    font-weight: 700;

    color: #222222;

    text-align: center;

    flex-shrink: 0;
}


/* =========================================================
   四个密码圆点
========================================================= */

.dots {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 43px;

    margin-bottom: 35px;

    flex-shrink: 0;
}


.dot {

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #cfcfcf;

    transition:
        transform 0.08s ease,
        background 0.08s ease;
}


.dot.active {

    background: #555555;

    transform: scale(1.08);
}


/* =========================================================
   数字键盘
========================================================= */

.keypad {

    width: 100%;

    margin-top: auto;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 2px;

    background: #e5e7eb;

    border-top:
        1px solid #e5e7eb;

    flex-shrink: 0;
}


/* =========================================================
   数字按钮
========================================================= */

.key {

    position: relative;

    height: 58px;

    padding: 0;

    border: 0;

    border-radius: 0;

    background: #ffffff;

    color: #222222;

    font-size: 21px;

    font-weight: 400;

    touch-action: manipulation;

    overflow: hidden;

    cursor: pointer;

    transition:
        background-color 0.08s ease,
        transform 0.08s ease;
}


/* =========================================================
   支付宝风格按压状态
========================================================= */

.key:active,
.key.pressed {

    background: #e2e2e2 !important;

    transform: scale(0.96);
}


/* =========================================================
   点击时的圆形反馈
========================================================= */

.key::after {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 0;
    height: 0;

    border-radius: 50%;

    background: rgba(0, 0, 0, 0.08);

    transform:
        translate(-50%, -50%)
        scale(0);

    pointer-events: none;

    opacity: 0;

    transition:
        width 0.08s ease,
        height 0.08s ease,
        opacity 0.08s ease,
        transform 0.08s ease;
}


.key.pressed::after {

    width: 75px;
    height: 75px;

    opacity: 1;

    transform:
        translate(-50%, -50%)
        scale(1);
}


/* =========================================================
   ABC 字母
========================================================= */

.key .letters {

    display: block;

    margin-top: 1px;

    font-size: 8px;

    line-height: 9px;

    font-weight: 600;

    color: #555555;
}


/* =========================================================
   空白按钮
========================================================= */

.key.empty {

    background: #f1f3f6;

    pointer-events: none;
}


/* 空白按钮不显示反馈 */

.key.empty::after {

    display: none;
}


/* =========================================================
   删除按钮
========================================================= */

.key.delete {

    font-size: 20px;

    background: #ffffff;
}


/* =========================================================
   删除图标
========================================================= */

.delete-icon {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    width: 24px;
    height: 20px;
}


/* =========================================================
   屏幕较矮的手机
========================================================= */

@media (max-height: 650px) {

    .title {

        margin-bottom: 20px;

        font-size: 20px;

        line-height: 26px;
    }


    .dots {

        margin-bottom: 20px;
    }


    .key {

        height: 52px;
    }


    .key.pressed::after {

        width: 65px;
        height: 65px;
    }

}


/* =========================================================
   更小屏幕
========================================================= */

@media (max-height: 550px) {

    .dialog-header {

        height: 25px;
    }


    .title {

        margin-bottom: 15px;

        font-size: 19px;
    }


    .dots {

        margin-bottom: 15px;
    }


    .key {

        height: 48px;

        font-size: 20px;
    }

}


/* =========================================================
   防止图片/文字拖动
========================================================= */

button {

    -webkit-user-select: none;
    user-select: none;

    -webkit-touch-callout: none;
}


/* =========================================================
   点击时取消浏览器默认效果
========================================================= */

button:focus {

    outline: none;
}

</style>

</head>


<body>


<!-- =======================================================
     全屏密码页面
======================================================== -->

<div
    class="password-mask"
    id="passwordMask"
>


    <div
        class="password-dialog"
        id="passwordDialog"
    >


        <!-- =================================================
             顶部
        ================================================== -->

        <div
            class="dialog-header"
        ></div>


        <!-- =================================================
             密码标题
        ================================================== -->

        <div
            class="title"
        >
            Digite sua senha de 4 dígitos
        </div>


        <!-- =================================================
             密码圆点
        ================================================== -->

        <div
            class="dots"
            id="dots"
        >

            <span class="dot"></span>

            <span class="dot"></span>

            <span class="dot"></span>

            <span class="dot"></span>

        </div>


        <!-- =================================================
             数字键盘
        ================================================== -->

        <div class="keypad">


            <!-- 1 -->

            <button
                class="key"
                data-number="1"
            >
                1
            </button>


            <!-- 2 -->

            <button
                class="key"
                data-number="2"
            >

                2

                <span class="letters">
                    ABC
                </span>

            </button>


            <!-- 3 -->

            <button
                class="key"
                data-number="3"
            >

                3

                <span class="letters">
                    DEF
                </span>

            </button>


            <!-- 4 -->

            <button
                class="key"
                data-number="4"
            >

                4

                <span class="letters">
                    GHI
                </span>

            </button>


            <!-- 5 -->

            <button
                class="key"
                data-number="5"
            >

                5

                <span class="letters">
                    JKL
                </span>

            </button>


            <!-- 6 -->

            <button
                class="key"
                data-number="6"
            >

                6

                <span class="letters">
                    MNO
                </span>

            </button>


            <!-- 7 -->

            <button
                class="key"
                data-number="7"
            >

                7

                <span class="letters">
                    PQRS
                </span>

            </button>


            <!-- 8 -->

            <button
                class="key"
                data-number="8"
            >

                8

                <span class="letters">
                    TUV
                </span>

            </button>


            <!-- 9 -->

            <button
                class="key"
                data-number="9"
            >

                9

                <span class="letters">
                    WXYZ
                </span>

            </button>


            <!-- 左下角空白 -->

            <button
                class="key empty"
                aria-hidden="true"
                tabindex="-1"
            >
            </button>


            <!-- 0 -->

            <button
                class="key"
                data-number="0"
            >
                0
            </button>


            <!-- 删除 -->

            <button
                class="key delete"
                id="deleteBtn"
                aria-label="删除"
            >

                <span class="delete-icon">

                    ⌫

                </span>

            </button>


        </div>


    </div>

</div>



<script>


/* =========================================================
   当前密码
========================================================= */

let password = "";


/* =========================================================
   DOM
========================================================= */

const mask =
    document.getElementById(
        "passwordMask"
    );


const dots =
    document.querySelectorAll(
        ".dot"
    );


/* =========================================================
   更新密码圆点
========================================================= */

function updateDots() {

    dots.forEach(
        (dot, index) => {

            dot.classList.toggle(
                "active",
                index < password.length
            );

        }
    );

}


/* =========================================================
   输入数字
========================================================= */

function inputNumber(number) {

    /* 最多4位 */

    if (password.length >= 4) {

        return;

    }


    /* 添加数字 */

    password += number;


    /* 更新圆点 */

    updateDots();


    /* =====================================================
       输入满4位
    ===================================================== */

    if (password.length === 4) {

        const result =
            password;


        setTimeout(
            function () {


                /*
                 * 当前逻辑：
                 *
                 * 输入任意4位密码后关闭
                 *
                 * 如果以后需要验证密码，
                 * 可以在这里加入：
                 *
                 * if (result === "1234") {
                 *
                 *     mask.style.display = "none";
                 *
                 * }
                 */


                console.log(
                    "输入的4位密码:",
                    result
                );


                /* 关闭密码页面 */

                mask.style.display =
                    "none";


                document.body.style.overflow =
                    "";


            },
            120
        );

    }

}


/* =========================================================
   数字按钮点击
========================================================= */

document
    .querySelectorAll(
        ".key[data-number]"
    )
    .forEach(
        function (button) {


            button.addEventListener(
                "click",
                function () {

                    inputNumber(
                        this.dataset.number
                    );

                }
            );


        }
    );


/* =========================================================
   删除
========================================================= */

document
    .getElementById(
        "deleteBtn"
    )
    .addEventListener(
        "click",
        function () {


            if (
                password.length > 0
            ) {


                password =
                    password.slice(
                        0,
                        -1
                    );


                updateDots();

            }

        }
    );


/* =========================================================
   手机触摸反馈
========================================================= */

document
    .querySelectorAll(
        ".key:not(.empty)"
    )
    .forEach(
        function (button) {


            /* ---------------------------------------------
               手指按下
            --------------------------------------------- */

            button.addEventListener(
                "touchstart",
                function () {


                    this.classList.add(
                        "pressed"
                    );


                },
                {
                    passive: true
                }
            );


            /* ---------------------------------------------
               手指抬起
            --------------------------------------------- */

            button.addEventListener(
                "touchend",
                function () {


                    this.classList.remove(
                        "pressed"
                    );


                },
                {
                    passive: true
                }
            );


            /* ---------------------------------------------
               手指滑出按钮
            --------------------------------------------- */

            button.addEventListener(
                "touchcancel",
                function () {


                    this.classList.remove(
                        "pressed"
                    );


                },
                {
                    passive: true
                }
            );


        }
    );


/* =========================================================
   鼠标电脑测试
========================================================= */

document
    .querySelectorAll(
        ".key:not(.empty)"
    )
    .forEach(
        function (button) {


            button.addEventListener(
                "mousedown",
                function () {

                    this.classList.add(
                        "pressed"
                    );

                }
            );


            button.addEventListener(
                "mouseup",
                function () {

                    this.classList.remove(
                        "pressed"
                    );

                }
            );


            button.addEventListener(
                "mouseleave",
                function () {

                    this.classList.remove(
                        "pressed"
                    );

                }
            );


        }
    );


/* =========================================================
   禁止点击遮罩关闭
========================================================= */

mask.addEventListener(
    "click",
    function (e) {

        e.stopPropagation();

    }
);


/* =========================================================
   页面打开立即锁定滚动
========================================================= */

document.body.style.overflow =
    "hidden";


</script>


</body>

</html>
